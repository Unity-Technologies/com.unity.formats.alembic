{% metadata_file .yamato/global.metafile %}
---

# Package clean console test jobs
{% for platform in test_platforms %}
{% for editor in clean_console_test_editors %}
# Trunk has no Intel (x64) macOS Editor, so these jobs are not generated for the Intel Mac platform (ABC-556).
{% unless editor.version == "trunk" and platform.name == "mac" %}
clean_console_test_{{ platform.name }}_{{ editor.version }}:
  name: Package clean console test in {{ editor.version }} on {{ platform.name }}
  agent:
    type: {{ platform.type }}
{% if platform.model %}
    model: {{ platform.model }}
{% endif %}
    image: {{ platform.image }}
    flavor: {{ platform.flavor}}
  commands:
    - brick_source: git@github.cds.internal.unity3d.com:wind-xu/clean_console_test_brick.git@v0.4.1
      variables:
        CLEAN_CONSOLE_TEST_FOR: package
        PACKAGE_PATH: ./com.unity.formats.alembic
        EDITOR_VERSION: {{ editor.version }}
        EXEMPTION_FILE_DIR: .yamato
        WARNINGS_AS_ERRORS: false
{% if platform.model == "M1" %}
  # Download the arm64 Editor on Silicon Mac. Set at job level because the brick does not receive it as a brick variable (ABC-556).
  variables:
    EDITOR_ARCHITECTURE: arm64
{% endif %}
  dependencies:
    - .yamato/package-pack.yml#pack
{% endunless %}
{% endfor %}
{% endfor %}

